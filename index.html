<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Informations légales — Tarots Mystiques</title>
  <style>
    :root { --bg:#08080f; --gold:#d4af37; --gold-light:#f0d060; --text:#f0e6d3; --muted:#8a7a6a; --border:#d4af3740; }
    * { box-sizing:border-box; margin:0; padding:0; }
    body { background:var(--bg); color:var(--text); font-family:system-ui,sans-serif; display:flex; align-items:center; justify-content:center; min-height:100vh; padding:24px; }
    .card { max-width:400px; width:100%; text-align:center; }
    .star { font-size:48px; color:var(--gold); display:block; margin-bottom:24px; }
    h1 { font-size:20px; letter-spacing:3px; text-transform:uppercase; color:var(--gold); font-weight:normal; margin-bottom:8px; }
    p { font-size:14px; color:var(--muted); margin-bottom:36px; }
    .links { display:flex; flex-direction:column; gap:14px; }
    a.btn {
      display:block; padding:16px; border:1px solid var(--border);
      border-radius:12px; color:var(--gold-light); text-decoration:none;
      font-size:15px; letter-spacing:1px; transition:background 0.2s;
    }
    a.btn:hover { background:#1a1a2e; }
    a.btn span { display:block; font-size:12px; color:var(--muted); margin-top:4px; letter-spacing:0; }
  </style>
</head>
<body>
  <div class="card">
    <i class="star">✦</i>
    <h1>Tarots Mystiques</h1>
    <p>Informations légales et confidentialité</p>
    <div class="links">
      <a class="btn" href="cgu.html">
        Conditions Générales d'Utilisation
        <span>Règles d'utilisation de l'application</span>
      </a>
      <a class="btn" href="privacy.html">
        Politique de confidentialité
        <span>Comment vos données sont traitées</span>
      </a>
    </div>
  </div>
</body>
</html>
